name: Prepare reviewed profile blobs
on:
  push:
    branches: ['audit/security-profile-reads-20260922']
    paths: ['.github/workflows/prepare-profile-review-blobs.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'kholyo18/unispace' && github.ref == 'refs/heads/audit/security-profile-reads-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae3e09f2dabf7f59d7dbae3bc8b6d7a7f796e6b3
          persist-credentials: false
      - name: Prepare five exact unreferenced source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a1df2c031cdd937c20d2f86b3d8a97c338fb33ecf2e132ed7446868e784b926e'
          expected = {
              'firestore.rules': ('add93249f40d6061b77b6468a8dd4f946f700e85', '172694337c48e68dca4f21e5b86106e9d15146b0'),
              'security/rules-review/firestore.candidate.rules': ('add93249f40d6061b77b6468a8dd4f946f700e85', '172694337c48e68dca4f21e5b86106e9d15146b0'),
              'functions/security/public-profile.js': ('f1352febba96b74d414399acf4f5920f1fe049df', '9ec442fe656a2a2dbfa2183693354acf9f956732'),
              'lib/main.dart': ('814153c2684ca7d80f7e8acdc6843493c0958707', '28a7daf71aeba09f28ed9688c4dc918b3b399a99'),
              'lib/ui/settings/public_profile_service.dart': ('dd957d8e8f50b3e13dd39fb9cca9e7ac6dea51ed', 'a0c3174e2e981d533d3d2188020e3f891800965a'),
          }
          def blob_sha(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          for name, hashes in expected.items():
              assert blob_sha(pathlib.Path(name).read_bytes()) == hashes[0], name
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected)
          for name, hashes in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert blob_sha(data) == hashes[1], name
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/kholyo18/unispace/git/blobs', data=body,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == hashes[1]
              print(name + ': ' + result['sha'])
          print('Prepared exact unreferenced blobs only. No branch, production data or Firebase deployment changed.')
          PY
