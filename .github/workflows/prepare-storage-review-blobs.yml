name: Prepare reviewed Storage source
on:
  push:
    branches: ['audit/security-storage-20260922']
    paths: ['.github/workflows/prepare-storage-review-blobs.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-blobs:
    if: github.repository == 'kholyo18/unispace' && github.ref == 'refs/heads/audit/security-storage-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare only exact reviewed source blobs without moving branches or deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import hashlib, json, pathlib, os, urllib.request, base64, re
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          records = [
          ('firestore.rules','3ca99c82c53a331e0f9082a276bb4d523a433af5','cf8f2bf3b8d2413a193067db8153737ec7aa63ef'),
          ('functions/index.js','c8a736c296e9d979f512b6410aa0fe5c288092ac','71b2591dbcbb2068c0d4e6b7967d5491138e9a13'),
          ('functions/security/account-deletion-request.js','ceb4dabdd637594a162ccaba98e4298f7efa93b7','bf8f0ed38f43219aace1b46fff910046f65cf245'),
          ('functions/security/account-deletion-worker.js','72057310084eac905fd796ed18691a0939400406','2f8f39ead554e4ca2d8c9a30f9f60a0ea4f11354'),
          ('functions/security/account-state.js','e671e5730e0e9d6ee3c939205c8cdf013db40ede','a0a830f209d58c5a30c8ab8f473966fc7fa92fa1'),
          ('functions/test/account-deletion-worker.integration.test.cjs','fd47ea6ce03852bfba9c8458821ee100706d052c','bba2a61c2b5d6131f93a837a52e3aa55bff27369'),
          ('lib/features/auth/signup_flow.dart','5bcfe352e090b07549dfef8c7e1d5dd7efeb6589','0ea42d07847d54f6b0e3142fe2ac2801161a96c8'),
          ('lib/features/shell/chat_page.dart','2752b862bbbd4ceb6621d5d957e5c41c1918a1ec','7cb2dc3558dd370adff0e7c0e128640a8a0be71d'),
          ('lib/main.dart','66a3b373ff57ab7d37aea2811eb20d3513a6b5d5','0c8a7d19ebcea3582522f794e4ab01a89f81b30a'),
          ('security/rules-review/STORAGE_REVIEW.md','21d4d77b376efa872a2a97361f277a2b7d54a8c1','cc78f05be9c92b18d7a02887ae55051891f73a36'),
          ('security/rules-review/firestore.candidate.rules','3ca99c82c53a331e0f9082a276bb4d523a433af5','cf8f2bf3b8d2413a193067db8153737ec7aa63ef')]
          def transform(path, source):
              def replace(old, new, count=1):
                  nonlocal source
                  assert source.count(old) == count, 'Patch target changed: '+path
                  source = source.replace(old, new)
              if path in ['firestore.rules','security/rules-review/firestore.candidate.rules']:
                  replace('  match /databases/{database}/documents {\n', '  match /databases/{database}/documents {\n    match /storageUploadGrants/{grantId} { allow read, write: if false; }\n')
              elif path == 'functions/index.js':
                  source += "\nconst { createStorageUploadHandler } = require('./security/storage-upload');\nexports.prepareStorageUpload = onCall({ region: 'europe-west1', timeoutSeconds: 60 },\n  createStorageUploadHandler({ auth: getAuth(), db: getFirestore(), FieldValue, Timestamp,\n    bucketName: () => commentMediaBucket.value() }));\n"
              elif path == 'functions/security/account-deletion-request.js':
                  replace("      const cutoff = await tx.get(db.collection('authRevocations').doc(uid));", "      const cutoffRef = db.collection('authRevocations').doc(uid);\n      const cutoff = await tx.get(cutoffRef);")
                  replace('      const existing = await tx.get(requestRef);\n', '      const existing = await tx.get(requestRef);\n      if (cutoff.data()?.storageAllowed !== false) {\n        tx.set(cutoffRef, { revokedBefore: cutoff.data()?.revokedBefore ?? 0, storageAllowed: false }, { merge: true });\n      }\n')
              elif path == 'functions/security/account-deletion-worker.js':
                  replace('  await deleteReceiptRows(db, uid);\n', "  await deleteReceiptRows(db, uid);\n  await deleteExpired(db.collection('storageUploadGrants').where('uid', '==', uid), db);\n")
                  replace('  await cleanupExpiredReports({ db, Timestamp, nowMs });\n', "  await cleanupExpiredReports({ db, Timestamp, nowMs });\n  await deleteExpired(db.collection('storageUploadGrants').where('expiresAt', '<=', cutoff), db);\n")
              elif path == 'functions/security/account-state.js':
                  replace('actor, action, administrative = null) {', 'actor, action, administrative = null, revokedBefore = 0) {')
                  replace('    tx.update(ref, patch);', '    // Invalidate outstanding Storage permissions atomically on every state change.\n    tx.set(db.doc(`authRevocations/${ref.id}`), { revokedBefore, storageAllowed: false }, { merge: true });\n    tx.update(ref, patch);')
                  replace('before, next, uid, input.action);', 'before, next, uid, input.action, null, cutoff.data()?.revokedBefore ?? 0);')
                  replace("uid, i.suspended ? 'suspend' : 'reinstate', i.reasonCode);", "uid, i.suspended ? 'suspend' : 'reinstate', i.reasonCode, previousCutoff);")
              elif path == 'functions/test/account-deletion-worker.integration.test.cjs':
                  replace('    const result = await worker();', "    await db.doc('storageUploadGrants/alice-active').set({uid:'alice',expiresAt:Timestamp.fromMillis(now + 60000)});\n    await db.doc('storageUploadGrants/bob-active').set({uid:'bob',expiresAt:Timestamp.fromMillis(now + 60000)});\n    await db.doc('storageUploadGrants/bob-expired').set({uid:'bob',expiresAt:Timestamp.fromMillis(now - 60000)});\n    const result = await worker();")
                  replace("    assert.equal((await db.doc('accountStateControls/alice').get()).exists, false);", "    assert.equal((await db.doc('accountStateControls/alice').get()).exists, false);\n    assert.equal((await db.doc('storageUploadGrants/alice-active').get()).exists, false);\n    assert.equal((await db.doc('storageUploadGrants/bob-active').get()).exists, true);\n    assert.equal((await db.doc('storageUploadGrants/bob-expired').get()).exists, false);")
              elif path.endswith('.dart'):
                  expected = 1 if path.endswith('signup_flow.dart') else 8
                  assert len(re.findall(r'\bref\.put(?:Data|File)\(', source)) == expected
                  source = re.sub(r'\bref\.put(Data|File)\(', r'StorageUploadService.put\1(ref, ', source)
                  source = source.replace('(ref, \n', '(ref,\n')
                  source = "import 'package:UniSpace/services/storage_upload_service.dart';\n" + source
                  if path.endswith('chat_page.dart'):
                      replace('final id = DateTime.now().millisecondsSinceEpoch.toString();', "final id = FirebaseFirestore.instance.collection('chats').doc().id;", 5)
                      replace('final id = DateTime.now()\n          .millisecondsSinceEpoch\n          .toString();', "final id = FirebaseFirestore.instance.collection('chats').doc().id;")
              elif path == 'security/rules-review/STORAGE_REVIEW.md':
                  source += '\n## Stage 6 superseding candidate\n\nThe executable candidate now uses scoped upload grants and a server-owned access\nprojection. See STAGE6_STORAGE_AUTHORIZATION.md for the new client/backend contract,\nexplicit token-URL limitations and non-deployment status. Earlier ownership-only\nnotes above describe the historical candidate, not the current test policy.\n'
              else:
                  raise ValueError('Unknown reviewed path')
              return source.encode('utf8')
          prepared = []
          for path, before, after in records:
              data = pathlib.Path(path).read_bytes()
              assert blob(data) == before, 'Source changed: '+path
              result = transform(path, data.decode('utf8'))
              assert blob(result) == after, 'Unexpected patch output: '+path
              prepared.append((path, after, result))
          for path, after, data in prepared:
              request = urllib.request.Request('https://api.github.com/repos/kholyo18/unispace/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha'] == after
              print(path+' '+after)
          print('Unreferenced source blobs prepared. No branch, deployment, data or credential was changed.')
          PY
