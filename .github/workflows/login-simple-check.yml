name: Verify minimal login checkbox
on:
  push:
    branches: ['work/simple-login-inspect-20260917']
    paths: ['.github/workflows/login-simple-check.yml']
permissions:
  contents: read
jobs:
  prepare-blob:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply only the reviewed patch to its exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/main.dart)" = 33069d7dca6105b4bea6ded9ecaa10186e28ac9d
          git apply --check tools/simple-login.patch
          git apply tools/simple-login.patch
          git diff --check
          test "$(git hash-object lib/main.dart)" = 3b972fbc0fa59bff406d5a010eba59bf34b609a3
          test "$(git diff --name-only)" = lib/main.dart
          mkdir -p verification-output
          git diff -- lib/main.dart > verification-output/login.patch
      - name: Store verified source blob only (no branch update or commit)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, json, hashlib, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'kholyo18/unispace'
          data = Path('lib/main.dart').read_bytes()
          expected = '3b972fbc0fa59bff406d5a010eba59bf34b609a3'
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == expected
          payload = json.dumps({'encoding':'utf-8','content':data.decode('utf-8')}).encode()
          req = urllib.request.Request('https://api.github.com/repos/kholyo18/unispace/git/blobs',
            data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response:
            result = json.load(response)
          assert result['sha'] == expected
          Path('verification-output/blob.json').write_text(json.dumps({'base':'4f588aa2192618c8e8dba5d1f1f779332142340b','inputBlob':'33069d7dca6105b4bea6ded9ecaa10186e28ac9d','outputBlob':expected},indent=2))
          print('Verified source blob:',expected)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-login-blob
          path: verification-output/
          retention-days: 1
  widget-checks:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply exact login-only candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/main.dart)" = 33069d7dca6105b4bea6ded9ecaa10186e28ac9d
          git apply --check tools/simple-login.patch
          git apply tools/simple-login.patch
          test "$(git hash-object lib/main.dart)" = 3b972fbc0fa59bff406d5a010eba59bf34b609a3
          mkdir -p verification-output
          { git rev-parse HEAD; git hash-object lib/main.dart test/widgets/simple_login_terms_test.dart; } > verification-output/source.log
      - name: Set up verified Flutter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 --proto '=https' --proto-redir '=https' \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version > verification-output/flutter-version.log
      - name: Resolve committed dependencies and missing generated messages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee verification-output/dependencies.log
          git diff --exit-code -- pubspec.yaml pubspec.lock
          if [ ! -f lib/generated/intl/messages_all.dart ]; then
            generator_root="$RUNNER_TEMP/login-intl"
            mkdir -p "$generator_root/lib"
            cp pubspec.yaml "$generator_root/"
            cp -R lib/l10n "$generator_root/lib/l10n"
            dart pub global activate intl_utils 2.8.16
            (cd "$generator_root" && dart pub global run intl_utils:generate)
            test -f "$generator_root/lib/generated/intl/messages_all.dart"
            test ! -e lib/generated/intl
            cp -R "$generator_root/lib/generated/intl" lib/generated/intl
          fi
          git diff --exit-code -- pubspec.yaml pubspec.lock lib/l10n lib/generated/l10n.dart
      - name: Run actual login screen widget tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded test/widgets/simple_login_terms_test.dart \
            2>&1 | tee verification-output/login-tests.log
      - name: Preserve result without changing any branch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-login-tests
          path: verification-output/
          retention-days: 7
