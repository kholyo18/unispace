name: Verify login privacy reader
on:
  push:
    branches: ['work/privacy-login-20260917']
    paths:
      - '.github/workflows/privacy-login-check.yml'
      - 'tools/privacy-login.patch'
      - 'lib/features/settings/privacy/privacy_policy_screen.dart'
      - 'test/widgets/privacy_login_reader_test.dart'
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply only the login privacy button patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/main.dart)" = 45a482913becd25efd79d161596c671e1dd3089c
          git apply --check tools/privacy-login.patch
          git apply tools/privacy-login.patch
          git diff --check
          test "$(git diff --name-only)" = lib/main.dart
          mkdir -p verification-output
          git hash-object lib/main.dart > verification-output/main-blob.txt
          git diff -- lib/main.dart > verification-output/main.patch
      - name: Store verified patched main blob without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, json, hashlib, urllib.request
          from pathlib import Path
          data = Path('lib/main.dart').read_bytes()
          sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected = Path('verification-output/main-blob.txt').read_text().strip()
          assert sha == expected
          payload = json.dumps({'encoding':'utf-8','content':data.decode('utf-8')}).encode()
          req = urllib.request.Request(
            'https://api.github.com/repos/kholyo18/unispace/git/blobs',
            data=payload,
            method='POST',
            headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
            },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
            result = json.load(response)
          assert result['sha'] == sha
          Path('verification-output/blob.json').write_text(json.dumps({'mainBlob':sha}, indent=2))
          print('Verified patched main blob:', sha)
      - name: Set up checksum-verified Flutter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 --proto '=https' --proto-redir '=https' \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee verification-output/flutter-version.log
      - name: Resolve locked dependencies and missing generated messages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee verification-output/dependencies.log
          git diff --exit-code -- pubspec.yaml pubspec.lock
          if [ ! -f lib/generated/intl/messages_all.dart ]; then
            generator_root="$RUNNER_TEMP/privacy-intl"
            mkdir -p "$generator_root/lib"
            cp pubspec.yaml "$generator_root/"
            cp -R lib/l10n "$generator_root/lib/l10n"
            dart pub global activate intl_utils 2.8.16
            (cd "$generator_root" && dart pub global run intl_utils:generate)
            test -f "$generator_root/lib/generated/intl/messages_all.dart"
            test ! -e lib/generated/intl
            cp -R "$generator_root/lib/generated/intl" lib/generated/intl
          fi
          git diff --exit-code -- pubspec.yaml pubspec.lock lib/l10n lib/generated/l10n.dart
      - name: Analyze privacy reader and tests
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/features/settings/privacy/privacy_policy_screen.dart \
            test/widgets/privacy_login_reader_test.dart \
            2>&1 | tee verification-output/analyze.log
      - name: Run login, terms and privacy widget tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded \
            test/widgets/simple_login_terms_test.dart \
            test/widgets/terms_of_use_reader_test.dart \
            test/widgets/terms_of_use_copy_test.dart \
            test/widgets/privacy_login_reader_test.dart \
            2>&1 | tee verification-output/tests.log
      - name: Ensure unrelated tracked files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = lib/main.dart
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-login-${{ github.sha }}
          path: verification-output/
          retention-days: 7
