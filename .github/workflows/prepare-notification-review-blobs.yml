name: Prepare reviewed notification blobs
on:
  push:
    branches: ['audit/security-notifications-20260922']
    paths: ['.github/workflows/prepare-notification-review-blobs.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-blobs:
    if: github.repository == 'kholyo18/unispace' && github.ref == 'refs/heads/audit/security-notifications-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply only the hash-verified patch and create unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b293dc647e73146ee8ecec884dd20f7b17c4a360b33d0de29aff0626cb1ea9b0'
          before = {
              'firestore.rules': '172694337c48e68dca4f21e5b86106e9d15146b0',
              'security/rules-review/firestore.candidate.rules': '172694337c48e68dca4f21e5b86106e9d15146b0',
              'functions/security/create-comment.js': 'b922653ecd429fa6c0b88833778b4343fb412814',
              'functions/security/push-notification.js': '3cc37914a78b9c35338a478386c3940ac7c4a50b',
              'functions/security/push-preferences.js': '5a43f88610b195adb4f019deeee0bb678e6765ae',
              'lib/main.dart': '28a7daf71aeba09f28ed9688c4dc918b3b399a99',
          }
          after = {
              'firestore.rules': '177ecb79eb3ad8b8709646bf635f1f1bbc3349df',
              'security/rules-review/firestore.candidate.rules': '177ecb79eb3ad8b8709646bf635f1f1bbc3349df',
              'functions/security/create-comment.js': '80aaefb504ea13daac30fa9cf1e2246728229dca',
              'functions/security/push-notification.js': '6893b5ccfd518e64644677d9c607c557172f5155',
              'functions/security/push-preferences.js': '2af13123fe097f130706c96b308ca8c7f671490c',
              'lib/main.dart': '378247300e7af3840c5300f391125222f637eaea',
          }
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, expected in before.items():
              assert blob_sha(pathlib.Path(name).read_bytes()) == expected, 'Unexpected baseline: ' + name
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == set(after), 'Unexpected write surface'
          for name, expected in after.items():
              data = pathlib.Path(name).read_bytes()
              assert blob_sha(data) == expected, 'Unexpected patch result: ' + name
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/kholyo18/unispace/git/blobs',
                  data=payload, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print('Verified unreferenced blob: ' + name + ' ' + result['sha'])
          print('No branch, production resource or credential changed by this job.')
          PY
