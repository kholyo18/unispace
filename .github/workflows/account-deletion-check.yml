name: Verify account deletion request and retention UI
# rerun after confirmation-flow fix

on:
  push:
    branches: ['work/account-deletion-retention-20260918']
    paths: ['.github/workflows/account-deletion-check.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check Node and install locked function dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --prefix functions ci --ignore-scripts
      - name: Validate deletion callable and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/security/account-deletion-request.js
          node --check functions/index.js
          npm --prefix functions run test:deletion
      - name: Check external deletion page source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "unispace.0.1.0@gmail.com" legal/account-deletion.html
          grep -F "30 يوم" legal/account-deletion.html
          grep -F "180 يوم" legal/account-deletion.html
          grep -F "90 يوم" legal/account-deletion.html

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up checksum-verified Flutter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 --proto '=https' --proto-redir '=https' \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Resolve locked dependencies and generated messages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          if [ ! -f lib/generated/intl/messages_all.dart ]; then
            generator_root="$RUNNER_TEMP/deletion-intl"
            mkdir -p "$generator_root/lib"
            cp pubspec.yaml "$generator_root/"
            cp -R lib/l10n "$generator_root/lib/l10n"
            dart pub global activate intl_utils 2.8.16
            (cd "$generator_root" && dart pub global run intl_utils:generate)
            cp -R "$generator_root/lib/generated/intl" lib/generated/intl
          fi
          git diff --exit-code -- pubspec.yaml pubspec.lock lib/l10n lib/generated/l10n.dart
      - name: Analyze new deletion and retention surfaces
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/features/settings/privacy/account_deletion_screen.dart \
            lib/features/settings/privacy/data_retention_policy_screen.dart \
            test/widgets/account_deletion_retention_test.dart
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos \
            lib/ui/settings/privacy/privacy_account_overview_tab.dart
      - name: Run deletion and policy widget regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded \
            test/widgets/account_deletion_retention_test.dart \
            test/widgets/privacy_login_reader_test.dart \
            test/widgets/community_guidelines_reader_test.dart
