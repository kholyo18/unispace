name: Prepare exact reviewed chat mute source blobs
on:
  push:
    branches: ['audit/prepare-chat-mute-source-20260923']
    paths: ['.github/workflows/prepare-chat-mute-source.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'kholyo18/unispace'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '763255912be15d0a870c394c3855d97a44e5ec3f'
          persist-credentials: false
      - name: Apply only the reviewed hash-bound patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '763255912be15d0a870c394c3855d97a44e5ec3f'
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '3246d02ed0831fcc96ada70fe7c9e1a6c32863810967ed6b4892f3d8176cfef4'
          pathlib.Path('/tmp/chat-mute-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/chat-mute-reviewed.patch
          git apply /tmp/chat-mute-reviewed.patch
      - name: Publish only digest-verified unreferenced blobs, never application refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const crypto = require('crypto');
            const expected = {".github/workflows/security-chat-preferences-client-verify.yml":"b80e2dd53b88e4f330174527d3762874105ac702","functions/client-test/chat-preferences-payload.test.cjs":"9c81090c68241323945c50775211842ca0c2930c","functions/test/chat-preferences-client-contract.test.cjs":"be48393f98e84bd6323bd698544a786760572366","lib/features/shell/chat_page.dart":"2958c1000fe590242b5dca828e051a528a5ead99","lib/services/chat_preferences_client.dart":"fd8c80d51f1f794c681aa26173c2ce0af33a8bba","security/rules-review/CHAT_MUTE_CONSISTENCY.md":"3814ddaaf394bdd132632664bb1574c34d8be26a","test/chat_mute_consistency_test.dart":"ef18f2f89b92f8fc2eea017ee99390f30d613436","test/chat_preferences_client_test.dart":"2f9ba74ba19778fafc8e8605bfe551536811b1dd"};
            const changed = cp.execFileSync('git', ['diff','--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
            const added = cp.execFileSync('git', ['ls-files','--others','--exclude-standard'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
            const actualPaths = [...new Set([...changed,...added])].sort();
            if (JSON.stringify(actualPaths) !== JSON.stringify(Object.keys(expected).sort())) throw Error('Unexpected source scope');
            const results = {};
            for (const [path, sha] of Object.entries(expected)) {
              const content = fs.readFileSync(path);
              const hash = crypto.createHash('sha1').update(Buffer.from(`blob ${content.length}\0`)).update(content).digest('hex');
              if (hash !== sha) throw Error('Source digest mismatch: ' + path);
              const result = await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,content:content.toString('base64'),encoding:'base64'});
              if (result.data.sha !== sha) throw Error('Published blob digest mismatch');
              results[path] = sha;
            }
            fs.writeFileSync('/tmp/chat-mute-prepared-blobs.json', JSON.stringify(results,null,2)+'\n');
            core.info(JSON.stringify(results));
            await core.summary.addHeading('Verified unreferenced mute repair blobs').addCodeBlock(JSON.stringify(results,null,2),'json').write();
      - uses: actions/upload-artifact@v4
        with:
          name: chat-mute-prepared-blobs
          path: /tmp/chat-mute-prepared-blobs.json
          retention-days: 7
