name: Verify community guidelines reader

on:
  push:
    branches: ['work/community-guidelines-20260918']
    paths:
      - '.github/workflows/community-guidelines-check.yml'
      - 'lib/features/legal/community_guidelines_screen.dart'
      - 'test/widgets/community_guidelines_reader_test.dart'

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply exact compact policy-links change
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('lib/main.dart')
          data = path.read_text(encoding='utf-8')
          current = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          assert current == 'f6d7d32ec0a943eb03e9bc9083a552a3ce8e1407', current

          import_needle = (
              "import 'features/auth/terms_of_use_screen.dart';\n"
              "import 'features/settings/privacy/privacy_policy_screen.dart';\n"
          )
          assert data.count(import_needle) == 1
          data = data.replace(
              import_needle,
              import_needle + "import 'features/legal/community_guidelines_screen.dart';\n",
          )

          old = """                              TextButton.icon(
                                key: const ValueKey('login-read-terms'),
                                onPressed: busy
                                    ? null
                                    : () => Navigator.of(context).push<void>(
                                          MaterialPageRoute<void>(
                                            builder: (_) => const TermsOfUseScreen(),
                                          ),
                                        ),
                                icon: const Icon(Icons.description_outlined),
                                label: const Text('قراءة شروط الاستخدام'),
                              ),
                              TextButton.icon(
                                key: const ValueKey('login-read-privacy'),
                                onPressed: busy
                                    ? null
                                    : () => Navigator.of(context).push<void>(
                                          MaterialPageRoute<void>(
                                            builder: (_) => const PrivacyPolicyScreen(),
                                          ),
                                        ),
                                icon: const Icon(Icons.privacy_tip_outlined),
                                label: const Text('قراءة سياسة الخصوصية'),
                              ),
"""
          new = """                              Row(
                                children: [
                                  Expanded(
                                    child: TextButton(
                                      key: const ValueKey('login-read-terms'),
                                      onPressed: busy
                                          ? null
                                          : () => Navigator.of(context).push<void>(
                                                MaterialPageRoute<void>(
                                                  builder: (_) =>
                                                      const TermsOfUseScreen(),
                                                ),
                                              ),
                                      child: const Text(
                                        'قراءة شروط الاستخدام',
                                        textAlign: TextAlign.center,
                                      ),
                                    ),
                                  ),
                                  Expanded(
                                    child: TextButton(
                                      key: const ValueKey('login-read-privacy'),
                                      onPressed: busy
                                          ? null
                                          : () => Navigator.of(context).push<void>(
                                                MaterialPageRoute<void>(
                                                  builder: (_) =>
                                                      const PrivacyPolicyScreen(),
                                                ),
                                              ),
                                      child: const Text(
                                        'قراءة سياسة الخصوصية',
                                        textAlign: TextAlign.center,
                                      ),
                                    ),
                                  ),
                                  Expanded(
                                    child: TextButton(
                                      key: const ValueKey('login-read-community'),
                                      onPressed: busy
                                          ? null
                                          : () => Navigator.of(context).push<void>(
                                                MaterialPageRoute<void>(
                                                  builder: (_) =>
                                                      const CommunityGuidelinesScreen(),
                                                ),
                                              ),
                                      child: const Text(
                                        'قراءة قواعد المجتمع',
                                        textAlign: TextAlign.center,
                                      ),
                                    ),
                                  ),
                                ],
                              ),
"""
          assert data.count(old) == 1
          data = data.replace(old, new)
          path.write_text(data, encoding='utf-8')

          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip()
          assert changed == 'lib/main.dart', changed

          Path('verification-output').mkdir(exist_ok=True)
          Path('verification-output/patched-main-blob.txt').write_text(
              subprocess.check_output(['git', 'hash-object', str(path)], text=True),
              encoding='utf-8',
          )
          Path('verification-output/main.patch').write_text(
              subprocess.check_output(['git', 'diff', '--', 'lib/main.dart'], text=True),
              encoding='utf-8',
          )

      - name: Store patched main as a Git blob without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path

          data = Path('lib/main.dart').read_text(encoding='utf-8')
          payload = json.dumps({'encoding':'utf-8','content':data}).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/kholyo18/unispace/git/blobs',
              data=payload,
              method='POST',
              headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              result = json.load(response)
          Path('verification-output/github-main-blob.txt').write_text(
              result['sha'] + '\n', encoding='utf-8'
          )
          print('Patched main blob:', result['sha'])

      - name: Set up checksum-verified Flutter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 --proto '=https' --proto-redir '=https' \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee verification-output/flutter-version.log

      - name: Resolve locked dependencies and missing generated messages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee verification-output/dependencies.log
          git diff --exit-code -- pubspec.yaml pubspec.lock
          if [ ! -f lib/generated/intl/messages_all.dart ]; then
            generator_root="$RUNNER_TEMP/community-intl"
            mkdir -p "$generator_root/lib"
            cp pubspec.yaml "$generator_root/"
            cp -R lib/l10n "$generator_root/lib/l10n"
            dart pub global activate intl_utils 2.8.16
            (cd "$generator_root" && dart pub global run intl_utils:generate)
            test -f "$generator_root/lib/generated/intl/messages_all.dart"
            test ! -e lib/generated/intl
            cp -R "$generator_root/lib/generated/intl" lib/generated/intl
          fi
          git diff --exit-code -- pubspec.yaml pubspec.lock lib/l10n lib/generated/l10n.dart

      - name: Analyze community reader and tests
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/features/legal/community_guidelines_screen.dart \
            test/widgets/community_guidelines_reader_test.dart \
            2>&1 | tee verification-output/analyze.log

      - name: Run login policy reader regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded \
            test/widgets/simple_login_terms_test.dart \
            test/widgets/terms_of_use_reader_test.dart \
            test/widgets/terms_of_use_copy_test.dart \
            test/widgets/privacy_login_reader_test.dart \
            test/widgets/community_guidelines_reader_test.dart \
            2>&1 | tee verification-output/tests.log

      - name: Confirm bounded source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.yaml pubspec.lock lib/l10n lib/generated/l10n.dart
          git status --short | tee verification-output/status.log

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-guidelines-verification
          path: verification-output/
          retention-days: 7
