name: Prepare reviewed follow client blob
on:
  push:
    branches: ['audit/security-follow-boundaries-20260922']
    paths: ['.github/workflows/prepare-follow-client-blob.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-blob:
    if: github.repository == 'kholyo18/unispace' && github.ref == 'refs/heads/audit/security-follow-boundaries-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare one verified source blob without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('lib/main.dart')
          original = path.read_bytes()
          def blob_sha(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert blob_sha(original) == 'c25a90365736f06b038daf8968b28e0b0ed54f20', 'Source changed; stop for review'
          old = """      await FirebaseFirestore.instance
                    .collection('users')
                    .doc(uid)
                    .collection('blocked_accounts')
                    .doc(account.id)
                    .delete();
                if (!mounted) return;
                setState(() => _items.removeWhere((e) => e.id == account.id));
                blockedListRevision.value++;"""
          # YAML indentation is removed before this Python program runs.
          # Normalize only this fixed patch literal, never the source document.
          old = '\n'.join([old.splitlines()[0]] + [line[10:] for line in old.splitlines()[1:]])
          new = """      if (FirebaseAuth.instance.currentUser?.uid != uid) {
                  throw StateError('Account changed');
                }
                await unblockAccount(account.id);
                if (!mounted || FirebaseAuth.instance.currentUser?.uid != uid) return;
                setState(() => _items.removeWhere((e) => e.id == account.id));"""
          new = '\n'.join([new.splitlines()[0]] + [line[10:] for line in new.splitlines()[1:]])
          source = original.decode('utf8')
          assert source.count(old) == 1, 'Patch target is not unique'
          updated = source.replace(old, new).encode('utf8')
          assert blob_sha(updated) == '814153c2684ca7d80f7e8acdc6843493c0958707', 'Unexpected patch output'
          payload = json.dumps({'content': base64.b64encode(updated).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/kholyo18/unispace/git/blobs',
              data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == blob_sha(updated)
          print('Verified unreferenced lib/main.dart blob: ' + result['sha'])
          print('No branch, commit, production resource or credential was modified.')
          PY
