name: Chat regression checks
on:
  pull_request:
    paths:
      - 'lib/features/shell/chat*/**'
      - 'lib/features/shell/chat_page.dart'
      - 'lib/services/chat_*.dart'
      - 'functions/security/chat-*.js'
      - 'functions/security/storage-upload.js'
      - 'test/chat*_test.dart'
      - 'functions/test/chat-*.test.cjs'
      - '.github/workflows/chat-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/chat*_test.dart test/signup_retry_test.dart test/account_profile_fields_test.dart --reporter expanded
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-unispace-security
      JAVA_TOOL_OPTIONS: '-Duser.language=en -Duser.country=US'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --ignore-scripts
      - name: Verify group, message, attachment and view-once boundaries
        run: >-
          npx --yes firebase-tools@15.18.0 emulators:exec --only firestore,auth
          --project demo-unispace-security --config firebase.security-test.json
          "node --test --test-concurrency=1 functions/test/chat-group-access.test.cjs functions/test/chat-service.test.cjs functions/test/chat-large-group-capacity.unit.test.cjs functions/test/chat-large-group-capacity.integration.test.cjs functions/test/chat-documents.test.cjs functions/test/chat-view-once.test.cjs"
