name: Prepare reviewed account lifecycle blobs
on:
  push:
    branches: ['audit/security-account-state-20260922']
    paths: ['.github/workflows/prepare-account-state-review-blobs.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-blobs:
    if: github.repository == 'kholyo18/unispace' && github.ref == 'refs/heads/audit/security-account-state-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the exact reviewed patch and create unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          api = 'https://api.github.com/repos/kholyo18/unispace/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def call(url, data=None):
              request = urllib.request.Request(url, data=None if data is None else json.dumps(data).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          chunks = ['802df00d31c24c990b83562ecff9ac878ddd644e',
                    '577977979e13035ef279e033014cad9b465227c2',
                    'a0f6647a9d806b4fda56bad85e6a4bf8a7f711f1',
                    '57da368da1435a916f7ae8d5df5f2621896c9194']
          parts = []
          for sha in chunks:
              result = call(api + '/' + sha)
              data = base64.b64decode(result['content'])
              assert blob_sha(data) == sha, 'Payload chunk changed'
              parts.append(data)
          packed = b''.join(parts)
          assert blob_sha(packed) == 'a98ec7777c4b636bbb7d320babf0ac691a4ee168', 'Unexpected reviewed payload'
          payload = json.loads(zlib.decompress(packed))
          assert len(payload['files']) == 23
          for name, hashes in payload['files'].items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert (blob_sha(path.read_bytes()) if path.exists() else None) == hashes['before'], 'Baseline changed: ' + name
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, hashes in payload['files'].items():
              data = pathlib.Path(name).read_bytes()
              assert blob_sha(data) == hashes['after'], 'Patch output changed: ' + name
              result = call(api, {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert result['sha'] == hashes['after']
              print(name + ' ' + result['sha'])
          print('Verified 23 unreferenced blobs. No commit, branch, deployment, live user data or credentials changed.')
          PY
