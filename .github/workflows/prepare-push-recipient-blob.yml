name: Prepare reviewed recipient main blob only
on:
  push:
    branches: ['audit/security-push-recipient-blob-20260923']
permissions:
  contents: read
jobs:
  prepare-blob:
    if: github.repository == 'kholyo18/unispace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Upload only the hash-verified main blob, never update a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 88395b4a823cd7a16e4ca5a6db9feaabfc3f8499
          test "$(git hash-object lib/main.dart)" = 0c8a7d19ebcea3582522f794e4ab01a89f81b30a
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/recipient.patch"
          echo "cd034198c89e7143c8db27cff126f4fe716f47a2c9d5c38d8ebf41b155cc6c90  $RUNNER_TEMP/recipient.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/recipient.patch"
          git apply "$RUNNER_TEMP/recipient.patch"
          test "$(git diff --name-only)" = lib/main.dart
          test "$(git hash-object lib/main.dart)" = 3655e9add10793f56262422d8491393e698a4e72
          echo '5f497cc3f15736c568aa7b8a30620e29f4972fe0b93a4e45ed5931133982eba4  lib/main.dart' | sha256sum -c -
          python - <<'PYCODE'
          import json
          from pathlib import Path
          Path('blob-request.json').write_text(json.dumps({'content':Path('lib/main.dart').read_text(), 'encoding':'utf-8'}))
          PYCODE
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary @blob-request.json \
            https://api.github.com/repos/kholyo18/unispace/git/blobs > recipient-main-blob.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          result=json.loads(Path('recipient-main-blob.json').read_text())
          assert result['sha']=='3655e9add10793f56262422d8491393e698a4e72', result
          PYCODE
          git diff -- lib/main.dart > recipient-main.patch
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-recipient-main-blob
          path: |
            recipient-main-blob.json
            recipient-main.patch
          retention-days: 7
