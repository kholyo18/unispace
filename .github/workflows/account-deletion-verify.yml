name: Account deletion verification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'firestore.indexes.required.json'
      - 'scripts/reconcile-firestore-indexes.cjs'
      - 'scripts/reconcile-firestore-indexes.test.cjs'
      - '.github/workflows/account-deletion-verify.yml'
      - '.github/workflows/firebase-account-deletion-deploy.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Syntax check deletion modules
        run: |
          node --check security/account-deletion-request.js
          node --check security/account-deletion-worker.js
          node --check index.js
      - name: Smoke load Functions entry point
        run: node -e "require('./index.js')"
      - name: Run account deletion unit tests
        run: >-
          node --test --test-concurrency=1
          test/account-deletion-request.test.cjs
          test/account-deletion-worker.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deletion worker against Firestore emulator
        run: >-
          npx --yes firebase-tools
          emulators:exec
          --only firestore
          --project demo-unispace-deletion
          --config ../firebase.json
          "node --test --test-concurrency=1 test/account-deletion-worker.integration.test.cjs"
      - name: Verify Firestore index reconciliation
        working-directory: .
        run: |
          node --check scripts/reconcile-firestore-indexes.cjs
          node --test scripts/reconcile-firestore-indexes.test.cjs
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync('firebase.json','utf8'));if(f.firestore?.indexes!=='firestore.indexes.json')process.exit(1)"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('firestore.indexes.required.json','utf8'));const f=JSON.parse(fs.readFileSync('firestore.indexes.json','utf8'));const k=x=>JSON.stringify(x);for(const i of r.indexes||[])if(!(f.indexes||[]).some(x=>k(x)===k(i)))process.exit(1);for(const o of r.fieldOverrides||[]){const m=(f.fieldOverrides||[]).find(x=>x.collectionGroup===o.collectionGroup&&x.fieldPath===o.fieldPath);if(!m)process.exit(1)}"
      - name: Verify manual production deploy workflow safety
        working-directory: .
        run: |
          test -f .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "workflow_dispatch:" .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "DEPLOY_FACHUB_C631C" .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "FIREBASE_GOOGLE_CREDENTIALS" .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "firestore:indexes" .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "functions:requestAccountDeletion,functions:processAccountDeletions" .github/workflows/firebase-account-deletion-deploy.yml
          grep -q "hosting" .github/workflows/firebase-account-deletion-deploy.yml
          if grep -q -- "--force" .github/workflows/firebase-account-deletion-deploy.yml; then
            echo "Production deploy workflow must never use --force."
            exit 1
          fi
      - name: Verify deletion hosting resource
        run: |
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync('../firebase.json','utf8'));if(f.hosting?.public!=='deletion-site'||f.hosting?.cleanUrls!==true)process.exit(1)"
          node -e "const fs=require('fs');const h=fs.readFileSync('../deletion-site/delete-account.html','utf8');if(!h.includes('mailto:unispace.0.1.0@gmail.com')||!h.includes('حذف حساب UniSpace'))process.exit(1)"
